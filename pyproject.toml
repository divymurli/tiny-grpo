[project]
name = "tiny-grpo"
version = "0.1.0"
description = "Tiny from-scratch GRPO experiments in PyTorch"
requires-python = ">=3.10"
dependencies = [
  "torch",
]

[project.optional-dependencies]
gsm8k = [
  "accelerate",
  "datasets",
  "peft",
  "transformers",
]

[tool.setuptools.packages.find]
where = ["src"]
